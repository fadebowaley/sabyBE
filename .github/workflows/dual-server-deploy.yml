name: 🚀 Dual Server Deployment (Staging + Production)

on:
  push:
    branches: [ production, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - both
      image_tag:
        description: 'Docker image tag to deploy (leave empty for latest)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fadebowaley/sabybe/halobe

  # Server Configuration
  PRODUCTION_HOST: ${{ secrets.PRODUCTION_SERVER_IP }}
  PRODUCTION_USER: haloadmin
  STAGING_HOST: ${{ secrets.STAGING_SERVER_IP }}
  STAGING_USER: haloadmin

  # SSH Configuration
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

  # Remote PostgreSQL Configuration
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

permissions:
  contents: write   # allow creating releases
  packages: write   # allow pushing docker images


jobs:
  # =============================================================================
  # BUILD & PUSH IMAGE
  # =============================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: fadebowaley
        password: ${{ secrets.GHCR_PAT }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Halo Backend
          org.opencontainers.image.description=Halo Backend API Service
          org.opencontainers.image.vendor=Halo
          org.opencontainers.image.licenses=MIT

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: |
          ${{ steps.meta.outputs.tags }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # =============================================================================
  # DEPLOY TO STAGING SERVER
  # =============================================================================
  deploy-staging:
    name: 🧪 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/develop' || 
       github.event.inputs.environment == 'staging' || 
       github.event.inputs.environment == 'both') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: staging

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ env.SSH_KEY }}" > ~/.ssh/staging_key
        chmod 600 ~/.ssh/staging_key
        ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

    - name: 🧪 Test PostgreSQL connection
      run: |
        echo "Testing PostgreSQL connection to remote database..."
        # Test connection without exposing credentials in logs
        if timeout 10 bash -c "</dev/tcp/${{ env.POSTGRES_HOST }}/${{ env.POSTGRES_PORT }}"; then
          echo "✅ PostgreSQL server is reachable on ${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}"
        else
          echo "❌ Cannot reach PostgreSQL server on ${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}"
          exit 1
        fi

    - name: 🚀 Deploy to staging server
      run: |
        echo "🚀 Deploying to staging server..."
        
        ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no ${{ env.STAGING_USER }}@${{ env.STAGING_HOST }} << 'EOF'
          set -e
          
          # Navigate to application directory
          cd /opt/halo-backend || { echo "❌ Application directory not found"; exit 1; }
          
          # Create environment file with remote PostgreSQL configuration
          cat > .env.staging << ENVEOF
        NODE_ENV=staging
        PORT=4000
        MONGODB_URL=mongodb://mongodb:27017/halo-staging
        
        # Remote PostgreSQL Configuration
        POSTGRES_HOST=${{ env.POSTGRES_HOST }}
        POSTGRES_PORT=${{ env.POSTGRES_PORT }}
        POSTGRES_USER=${{ env.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
        POSTGRES_DB=${{ env.POSTGRES_DB }}
        
        REDIS_HOST=redis
        REDIS_PORT=6379
        JWT_SECRET=${{ secrets.JWT_SECRET_STAGING }}
        HALOFE_URL=${{ secrets.STAGING_FRONTEND_URL }}
        ENVEOF
          
          # Pull latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Stop existing containers (ignore errors)
          docker-compose -f docker-compose.staging.yml down || true
          
          # Start new deployment
          docker-compose -f docker-compose.staging.yml up -d
          
          # Wait for services to be ready
          echo "⏳ Waiting for services to start..."
          sleep 30
          
          # Health check
          for i in {1..10}; do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "✅ Staging deployment successful!"
              exit 0
            fi
            echo "⏳ Attempt $i/10: Waiting for service..."
            sleep 10
          done
          
          echo "❌ Health check failed after 100 seconds"
          docker-compose -f docker-compose.staging.yml logs
          exit 1
        EOF

    - name: 🧪 Run staging smoke tests
      run: |
        echo "🧪 Running staging smoke tests..."
        
        # Test PostgreSQL endpoint
        curl -f http://${{ env.STAGING_HOST }}:4000/v1/postgres/status || exit 1
        echo "✅ PostgreSQL endpoint test passed"
        
        # Test basic API functionality
        curl -f http://${{ env.STAGING_HOST }}:4000/ || exit 1
        echo "✅ Basic API test passed"

  # =============================================================================
  # DEPLOY TO PRODUCTION SERVER
  # =============================================================================
  deploy-production:
    name: 🏭 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/production' || 
       github.event.inputs.environment == 'production' || 
       github.event.inputs.environment == 'both') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ env.SSH_KEY }}" > ~/.ssh/production_key
        chmod 600 ~/.ssh/production_key
        ssh-keyscan -H ${{ env.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: 🧪 Test PostgreSQL connection
      run: |
        echo "Testing PostgreSQL connection to remote database..."
        if timeout 10 bash -c "</dev/tcp/${{ env.POSTGRES_HOST }}/${{ env.POSTGRES_PORT }}"; then
          echo "✅ PostgreSQL server is reachable on ${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}"
        else
          echo "❌ Cannot reach PostgreSQL server on ${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }}"
          exit 1
        fi

    - name: 🏭 Deploy to production server
      run: |
        echo "🏭 Deploying to production server..."
        
        ssh -i ~/.ssh/production_key -o StrictHostKeyChecking=no ${{ env.PRODUCTION_USER }}@${{ env.PRODUCTION_HOST }} << 'EOF'
          set -e
          
          # Navigate to application directory
          cd /opt/halo-backend || { echo "❌ Application directory not found"; exit 1; }
          
          # Create environment file with remote PostgreSQL configuration
          cat > .env.production << ENVEOF
        NODE_ENV=production
        PORT=4000
        MONGODB_URL=mongodb://mongodb:27017/halo-production
        
        # Remote PostgreSQL Configuration
        POSTGRES_HOST=${{ env.POSTGRES_HOST }}
        POSTGRES_PORT=${{ env.POSTGRES_PORT }}
        POSTGRES_USER=${{ env.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}
        POSTGRES_DB=${{ env.POSTGRES_DB }}
        
        REDIS_HOST=redis
        REDIS_PORT=6379
        JWT_SECRET=${{ secrets.JWT_SECRET_PRODUCTION }}
        HALOFE_URL=${{ secrets.PRODUCTION_FRONTEND_URL }}
        ENVEOF
          
          # Pull latest image
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Create backup of current deployment
          docker-compose -f docker-compose.prod.yml ps > deployment_backup_$(date +%Y%m%d_%H%M%S).log || true
          
          # Rolling deployment with health checks
          docker-compose -f docker-compose.prod.yml up -d --no-deps halobe
          
          # Wait for new container to be ready
          echo "⏳ Waiting for new deployment to be ready..."
          sleep 45
          
          # Health check
          for i in {1..15}; do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "✅ Production deployment successful!"
              # Clean up old containers
              docker system prune -f
              exit 0
            fi
            echo "⏳ Attempt $i/15: Waiting for service..."
            sleep 10
          done
          
          echo "❌ Health check failed - rolling back..."
          docker-compose -f docker-compose.prod.yml logs
          # Could add rollback logic here
          exit 1
        EOF

    - name: 🏭 Run production smoke tests
      run: |
        echo "🏭 Running production smoke tests..."
        
        # Test PostgreSQL endpoint
        curl -f http://${{ env.PRODUCTION_HOST }}:4000/v1/postgres/status || exit 1
        echo "✅ PostgreSQL endpoint test passed"
        
        # Test basic API functionality
        curl -f http://${{ env.PRODUCTION_HOST }}:4000/ || exit 1
        echo "✅ Basic API test passed"

  # =============================================================================
  # DEPLOYMENT SUMMARY
  # =============================================================================
  deployment-summary:
    name: 📊 Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging, deploy-production]
    if: always()

    steps:
    - name: 📊 Summary
      run: |
        echo "## 📊 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🐳 Docker Image" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ needs.build-and-push.result == 'success' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🗄️ Database Configuration" >> $GITHUB_STEP_SUMMARY
        echo "- **PostgreSQL**: Remote database on VM (${{ env.POSTGRES_HOST }}:${{ env.POSTGRES_PORT }})" >> $GITHUB_STEP_SUMMARY
        echo "- **Database**: \`${{ env.POSTGRES_DB }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Connection**: External (distributed)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Deployments" >> $GITHUB_STEP_SUMMARY
        echo "- **Staging**: ${{ needs.deploy-staging.result == 'success' && '✅ Success' || (needs.deploy-staging.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Production**: ${{ needs.deploy-production.result == 'success' && '✅ Success' || (needs.deploy-production.result == 'skipped' && '⏭️ Skipped' || '❌ Failed') }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Notes" >> $GITHUB_STEP_SUMMARY
        echo "- PostgreSQL container removed from Docker Compose" >> $GITHUB_STEP_SUMMARY
        echo "- Using distributed PostgreSQL database on VM" >> $GITHUB_STEP_SUMMARY
        echo "- Improved scalability and consistency across environments" >> $GITHUB_STEP_SUMMARY
