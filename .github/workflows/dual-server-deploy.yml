name: 🚀 Dual Server Deployment (Staging + Production)

on:
  push:
    branches: [ production, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
        - both
      image_tag:
        description: 'Docker image tag to deploy (leave empty for latest)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fadebowaley/sabybe/halobe

  # Server Configuration
  PRODUCTION_HOST: ${{ secrets.PRODUCTION_SERVER_IP }}
  PRODUCTION_USER: haloadmin
  STAGING_HOST: ${{ secrets.STAGING_SERVER_IP }}
  STAGING_USER: haloadmin

  # SSH Configuration
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

permissions:
  contents: write   # allow creating releases
  packages: write   # allow pushing docker images


jobs:
  # =============================================================================
  # BUILD & PUSH IMAGE
  # =============================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3


    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: fadebowaley
        password: ${{ secrets.GHCR_PAT }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Halo Backend
          org.opencontainers.image.description=Halo Backend API Service
          org.opencontainers.image.vendor=Halo
          org.opencontainers.image.licenses=MIT

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: |
          ${{ steps.meta.outputs.tags }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # =============================================================================
  # DEPLOY TO STAGING SERVER
  # =============================================================================
  deploy-staging:
    name: 🧪 Deploy to Staging Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (inputs.environment == 'staging' || inputs.environment == 'both'))
    environment: staging

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 🏷️ Set deployment variables
      id: deploy
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENVIRONMENT="staging"
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="develop"
          fi
        else
          ENVIRONMENT="staging"
          IMAGE_TAG="develop"
        fi
        
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "FULL_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "SERVER_HOST=${{ env.STAGING_HOST }}" >> $GITHUB_OUTPUT
        echo "SERVER_USER=${{ env.STAGING_USER }}" >> $GITHUB_OUTPUT

    - name: 🚀 Deploy to staging server
      run: |
        echo "🚀 Deploying to STAGING server: ${{ steps.deploy.outputs.SERVER_HOST }}"
        echo "🐳 Image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        
        # Create deployment script
        cat > deploy-staging.sh << 'DEPLOY_SCRIPT'
        #!/bin/bash
        set -e
        
        echo "🔧 Setting up staging deployment..."
        
        # Create project directory if it doesn't exist
        mkdir -p ~/sabyBackend
        cd ~/sabyBackend
        
        # Pull latest code
        echo "📥 Pulling latest code..."
        git fetch origin
        git reset --hard origin/develop
        
        # Login to GitHub Container Registry
        echo "🔐 Logging in to GitHub Container Registry..."
        echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u fadebowaley --password-stdin
        echo "🐳 Pulling Docker image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        docker pull ${{ steps.deploy.outputs.FULL_IMAGE }}
        # Tag the image for local use
        docker tag ${{ steps.deploy.outputs.FULL_IMAGE }} halo-halobe:staging
        
        # Stop existing containers
        echo "🛑 Stopping existing staging containers..."
        ./docker-build.sh stop staging || true
        
        # Start new containers
        echo "🚀 Starting new staging containers..."
        ./docker-build.sh start staging
        
        # Health check
        echo "🏥 Running health check..."
        sleep 10
        ./docker-build.sh health staging
        
        echo "✅ Staging deployment completed successfully!"
        DEPLOY_SCRIPT
        
        # Copy deployment script to staging server
        scp -o ConnectTimeout=10 -o StrictHostKeyChecking=no deploy-staging.sh ${{ steps.deploy.outputs.SERVER_USER }}@${{ steps.deploy.outputs.SERVER_HOST }}:~/deploy-staging.sh
        
        # Execute deployment on staging server
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ steps.deploy.outputs.SERVER_USER }}@${{ steps.deploy.outputs.SERVER_HOST }} << 'REMOTE_COMMANDS'
        chmod +x ~/deploy-staging.sh
        ~/deploy-staging.sh
        rm ~/deploy-staging.sh
        REMOTE_COMMANDS

    - name: 📊 Staging deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Staging deployment successful"
          echo "🌐 Staging Server: ${{ steps.deploy.outputs.SERVER_HOST }}"
          echo "🐳 Image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        else
          echo "❌ Staging deployment failed"
        fi

  # =============================================================================
  # DEPLOY TO PRODUCTION SERVER
  # =============================================================================
  deploy-production:
    name: 🌟 Deploy to Production Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (inputs.environment == 'production' || inputs.environment == 'both'))
    environment: production

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 🏷️ Set deployment variables
      id: deploy
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENVIRONMENT="production"
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="latest"
          fi
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          ENVIRONMENT="production"
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
        else
          ENVIRONMENT="production"
          IMAGE_TAG="main"
        fi
        
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "FULL_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "SERVER_HOST=${{ env.PRODUCTION_HOST }}" >> $GITHUB_OUTPUT
        echo "SERVER_USER=${{ env.PRODUCTION_USER }}" >> $GITHUB_OUTPUT

    - name: 🚀 Deploy to production server
      run: |
        echo "🚀 Deploying to PRODUCTION server: ${{ steps.deploy.outputs.SERVER_HOST }}"
        echo "🐳 Image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        
        # Create deployment script
        cat > deploy-production.sh << 'DEPLOY_SCRIPT'
        #!/bin/bash
        set -e
        
        echo "🔧 Setting up production deployment..."
        
        # Create project directory if it doesn't exist
        mkdir -p ~/sabyBackend
        cd ~/sabyBackend
        
        # Pull latest code
        echo "📥 Pulling latest code..."
        git fetch origin
        git reset --hard origin/main
        
        # Login to GitHub Container Registry
        echo "🔐 Logging in to GitHub Container Registry..."
        echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u fadebowaley --password-stdin
        echo "🐳 Pulling Docker image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        docker pull ${{ steps.deploy.outputs.FULL_IMAGE }}
        # Tag the image for local use
        docker tag ${{ steps.deploy.outputs.FULL_IMAGE }} halo-halobe:production
        
        # Stop existing containers
        echo "🛑 Stopping existing production containers..."
        ./docker-build.sh stop prod || true
        
        # Start new containers
        echo "🚀 Starting new production containers..."
        ./docker-build.sh start prod
        
        # Health check
        echo "🏥 Running health check..."
        sleep 10
        ./docker-build.sh health prod
        
        echo "✅ Production deployment completed successfully!"
        DEPLOY_SCRIPT
        
        # Copy deployment script to production server
        scp -o ConnectTimeout=10 -o StrictHostKeyChecking=no deploy-production.sh ${{ steps.deploy.outputs.SERVER_USER }}@${{ steps.deploy.outputs.SERVER_HOST }}:~/deploy-production.sh
        
        # Execute deployment on production server
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ steps.deploy.outputs.SERVER_USER }}@${{ steps.deploy.outputs.SERVER_HOST }} << 'REMOTE_COMMANDS'
        chmod +x ~/deploy-production.sh
        ~/deploy-production.sh
        rm ~/deploy-production.sh
        REMOTE_COMMANDS

    - name: 🏷️ Get version tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: 📢 Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2

      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Release ${{ github.ref_name }}

        body: |
          🚀 **Halo Backend ${{ steps.version.outputs.VERSION }}**
             - Docker image: `ghcr.io/fadebowaley/sabybe/halobe:${{ github.ref_name }}`
          
          ## What's New
          - Production deployment completed
          - Docker image: `${{ steps.deploy.outputs.FULL_IMAGE }}`
          
          ## Deployment Details
          - **Environment**: Production
          - **Server**: ${{ steps.deploy.outputs.SERVER_HOST }}
          - **Service**: Halo Backend
          - **Port**: 4000
          - **Health Check**: ✅ Passed
        draft: false
        prerelease: false

    - name: 📊 Production deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Production deployment successful"
          echo "🌐 Production Server: ${{ steps.deploy.outputs.SERVER_HOST }}"
          echo "🐳 Image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        else
          echo "❌ Production deployment failed"
        fi

  # =============================================================================
  # CLEANUP
  # =============================================================================
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
    - name: 🧹 Clean up old images
      run: |
        echo "Cleaning up old Docker images..."
        # Keep only the last 5 versions
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}" | \
        grep "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | \
        tail -n +6 | \
        awk '{print $3}' | \
        xargs -r docker rmi || true

    - name: 📊 Update deployment status
      run: |
        echo "✅ Dual server deployment pipeline completed successfully"
        echo "🐳 Docker images built and deployed"
        echo "🔒 Security scans completed"
        echo "🧪 Tests passed"
