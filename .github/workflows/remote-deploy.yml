name: 🚀 Remote Server Deployment

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      image_tag:
        description: 'Docker image tag to deploy (leave empty for latest)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/halobe
  REMOTE_HOST: 172.191.51.123
  REMOTE_USER: haloadmin
  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
  # =============================================================================
  # BUILD & PUSH IMAGE
  # =============================================================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Halo Backend
          org.opencontainers.image.description=Halo Backend API Service
          org.opencontainers.image.vendor=Halo
          org.opencontainers.image.licenses=MIT

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  # =============================================================================
  # DEPLOY TO REMOTE SERVER
  # =============================================================================
  deploy-remote:
    name: 🚀 Deploy to Remote Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/develop' && 'staging' || 'production' }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 🏷️ Set deployment variables
      id: deploy
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          ENVIRONMENT="${{ inputs.environment }}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="latest"
          fi
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          ENVIRONMENT="production"
          IMAGE_TAG="${GITHUB_REF#refs/tags/}"
        elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
          ENVIRONMENT="staging"
          IMAGE_TAG="develop"
        else
          ENVIRONMENT="production"
          IMAGE_TAG="main"
        fi
        
        echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "FULL_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: 🚀 Deploy to remote server
      run: |
        echo "🚀 Deploying to ${{ steps.deploy.outputs.ENVIRONMENT }} environment..."
        echo "🐳 Image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        
        # Create deployment script
        cat > deploy.sh << 'DEPLOY_SCRIPT'
        #!/bin/bash
        set -e
        
        echo "🔧 Setting up deployment environment..."
        
        # Create project directory if it doesn't exist
        mkdir -p ~/sabyBackend
        cd ~/sabyBackend
        
        # Pull latest code
        echo "📥 Pulling latest code..."
        git fetch origin
        git reset --hard origin/${{ github.ref_name }}
        
        # Pull the Docker image
        echo "🐳 Pulling Docker image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        docker pull ${{ steps.deploy.outputs.FULL_IMAGE }}
        
        # Tag the image for local use
        docker tag ${{ steps.deploy.outputs.FULL_IMAGE }} halo-halobe:latest
        
        # Stop existing containers
        echo "🛑 Stopping existing containers..."
        ./docker-build.sh stop ${{ steps.deploy.outputs.ENVIRONMENT }} || true
        
        # Start new containers
        echo "🚀 Starting new containers..."
        ./docker-build.sh start ${{ steps.deploy.outputs.ENVIRONMENT }}
        
        # Health check
        echo "🏥 Running health check..."
        sleep 10
        ./docker-build.sh health ${{ steps.deploy.outputs.ENVIRONMENT }}
        
        echo "✅ Deployment completed successfully!"
        DEPLOY_SCRIPT
        
        # Copy deployment script to server
        scp -o ConnectTimeout=10 -o StrictHostKeyChecking=no deploy.sh ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }}:~/deploy.sh
        
        # Execute deployment on remote server
        ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no ${{ env.REMOTE_USER }}@${{ env.REMOTE_HOST }} << 'REMOTE_COMMANDS'
        chmod +x ~/deploy.sh
        ~/deploy.sh
        rm ~/deploy.sh
        REMOTE_COMMANDS

    - name: 📊 Deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to ${{ steps.deploy.outputs.ENVIRONMENT }} successful"
          echo "🌐 Server: ${{ env.REMOTE_HOST }}"
          echo "🐳 Image: ${{ steps.deploy.outputs.FULL_IMAGE }}"
        else
          echo "❌ Deployment to ${{ steps.deploy.outputs.ENVIRONMENT }} failed"
        fi
