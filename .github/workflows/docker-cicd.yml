name: 🚀 Halo Backend Docker CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/halobe
  SERVICE_NAME: halobe
  SERVICE_PORT: 4000

jobs:
  # =============================================================================
  # CODE QUALITY & TESTING
  # =============================================================================
  test:
    name: 🧪 Test & Quality Checks
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:6.0
        env:
          MONGO_INITDB_DATABASE: halo-test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: halo-test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Lint code
      run: npm run lint

    - name: 🎨 Check code formatting
      run: npm run prettier

    - name: 🧪 Run tests
      run: npm test
      env:
        NODE_ENV: test
        MONGODB_URL: mongodb://localhost:27017/halo-test
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: halo-test
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        JWT_SECRET: test-jwt-secret

    - name: 📊 Upload coverage reports
      uses: codecov/codecov-action@v3
      if: success()
      with:
        file: ./coverage/lcov.info
        flags: backend
        name: halo-backend-coverage

  # =============================================================================
  # DOCKER BUILD & SECURITY
  # =============================================================================
  build:
    name: 🐳 Build & Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      image-labels: ${{ steps.meta.outputs.labels }}

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=Halo Backend
          org.opencontainers.image.description=Halo Backend API Service
          org.opencontainers.image.vendor=Halo
          org.opencontainers.image.licenses=MIT

    - name: 🏗️ Build Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        outputs: type=registry

    - name: 🔒 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta.outputs.tags }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: 📤 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: 🧹 Clean up
      if: always()
      run: |
        docker system prune -f
        docker volume prune -f

  # =============================================================================
  # DOCKER COMPOSE VALIDATION
  # =============================================================================
  validate-compose:
    name: 🐙 Validate Docker Compose
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build production image for testing
      run: |
        docker build -t halo-halobe:test -f Dockerfile.prod .

    - name: 🧪 Test Docker Compose configurations
      run: |
        # Test production compose
        docker compose -f docker-compose.prod.yml config
        
        # Test development compose (if exists)
        if [ -f docker-compose.dev.yml ]; then
          docker compose -f docker-compose.dev.yml config
        fi
        
        # Test local compose (if exists)
        if [ -f docker-compose.local.yml ]; then
          docker compose -f docker-compose.local.yml config
        fi

    - name: 🏥 Health check validation
      run: |
        # Start services in background
        docker compose -f docker-compose.prod.yml up -d
        
        # Wait for services to be ready
        sleep 30
        
        # Check if main service is healthy
        if docker compose -f docker-compose.prod.yml ps | grep -q "healthy\|Up"; then
          echo "✅ Services are healthy"
        else
          echo "❌ Services are not healthy"
          docker compose -f docker-compose.prod.yml logs
          exit 1
        fi
        
        # Cleanup
        docker compose -f docker-compose.prod.yml down -v

  # =============================================================================
  # DEPLOYMENT
  # =============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, validate-compose]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🚀 Deploy to staging
      run: |
        # Pull the latest image
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
        
        # Deploy using your existing script
        chmod +x docker-build.sh
        ./docker-build.sh stop staging || true
        ./docker-build.sh build staging
        ./docker-build.sh start staging
        
        # Health check
        ./docker-build.sh health staging

    - name: 📢 Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Staging deployment successful"
        else
          echo "❌ Staging deployment failed"
        fi

  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, validate-compose]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    environment: production

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏷️ Get version tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: 🚀 Deploy to production
      run: |
        # Pull the tagged image
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
        
        # Deploy using your existing script
        chmod +x docker-build.sh
        ./docker-build.sh stop prod || true
        ./docker-build.sh build prod
        ./docker-build.sh start prod
        
        # Health check
        ./docker-build.sh health prod

    - name: 📢 Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        release_name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          🚀 **Halo Backend ${{ steps.version.outputs.VERSION }}**
          
          ## What's New
          - Production deployment completed
          - Docker image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}`
          
          ## Deployment Details
          - **Environment**: Production
          - **Service**: Halo Backend
          - **Port**: 4000
          - **Health Check**: ✅ Passed
        draft: false
        prerelease: false

  # =============================================================================
  # CLEANUP
  # =============================================================================
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
    - name: 🧹 Clean up old images
      run: |
        echo "Cleaning up old Docker images..."
        # Keep only the last 5 versions
        docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}" | \
        grep "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | \
        tail -n +6 | \
        awk '{print $3}' | \
        xargs -r docker rmi || true

    - name: 📊 Update deployment status
      run: |
        echo "✅ Deployment pipeline completed successfully"
        echo "🐳 Docker images built and deployed"
        echo "🔒 Security scans completed"
        echo "🧪 Tests passed"
