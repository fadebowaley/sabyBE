name: 🚀 Production VM Deployment

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: production)"
        required: false
        default: production
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fadebowaley/sabybe/halobe
  NODE_VERSION: "18"
  DEFAULT_PROD_HOST: 45.32.179.162
  DEFAULT_PROD_USER: saby
  DEFAULT_DEPLOY_DIR: /opt/saby

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production-deploy
  cancel-in-progress: true

jobs:
  test:
    name: ✅ Test
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URL: mongodb://127.0.0.1:27017/saby_ci
      JWT_SECRET: ci-test-jwt-secret
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧰 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 📦 Install deps
        run: npm ci

      - name: 🧪 Run tests
        run: npm test

  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=prod-
            type=raw,value=production
            type=raw,value=latest

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-production:
    name: 🏭 Deploy to Unified Production VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/production') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production')
    environment: production
    steps:
      - name: 🔒 Validate deploy ref
        run: |
          if [ "${{ github.ref }}" != "refs/heads/production" ]; then
            echo "❌ Manual deploys must run from production branch."
            exit 1
          fi

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🔐 Add server to known hosts
        run: |
          PROD_HOST="${{ secrets.SABY_PROD_VM_IP }}"
          if [ -z "$PROD_HOST" ]; then PROD_HOST="${{ env.DEFAULT_PROD_HOST }}"; fi
          mkdir -p ~/.ssh
          ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: 🚀 Deploy backend to production VM
        run: |
          PROD_HOST="${{ secrets.SABY_PROD_VM_IP }}"
          PROD_USER="${{ secrets.SABY_PROD_VM_USER }}"
          DEPLOY_DIR="${{ secrets.SABY_PROD_DEPLOY_DIR }}"
          GHCR_USER="${{ secrets.GHCR_USERNAME }}"
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"

          if [ -z "$PROD_HOST" ]; then PROD_HOST="${{ env.DEFAULT_PROD_HOST }}"; fi
          if [ -z "$PROD_USER" ]; then PROD_USER="${{ env.DEFAULT_PROD_USER }}"; fi
          if [ -z "$DEPLOY_DIR" ]; then DEPLOY_DIR="${{ env.DEFAULT_DEPLOY_DIR }}"; fi
          if [ -z "$GHCR_USER" ]; then GHCR_USER="fadebowaley"; fi
          if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="production"; fi

          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "❌ GHCR_PAT secret is required for production deploy."
            exit 1
          fi

          echo "🚀 Deploying backend to unified production VM"
          echo "🌿 Branch: ${{ github.ref }}"
          echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          echo "🖥️ Host: $PROD_USER@$PROD_HOST"

          ssh "$PROD_USER@$PROD_HOST" << ENDSSH
            set -euo pipefail
            cd "$DEPLOY_DIR"

            COMPOSE_FILE="docker-compose.yml"
            if [ ! -f "\$COMPOSE_FILE" ]; then
              if [ -f "docker-compose.prod.yml" ]; then
                COMPOSE_FILE="docker-compose.prod.yml"
              else
                echo "❌ No compose file found in $DEPLOY_DIR"
                ls -lah
                exit 1
              fi
            fi

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login "${{ env.REGISTRY }}" -u "$GHCR_USER" --password-stdin

            echo "📥 Pulling backend image..."
            docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"

            echo "🏷️ Tagging backend image for compose compatibility..."
            docker tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" "saby-backend:production-local"

            echo "🛡️ Enforcing production backend env policy..."
            if [ -f "env/backend.env" ]; then
              sed -i -E 's#^NODE_ENV=.*#NODE_ENV=production#' env/backend.env
              sed -i -E 's#^MONGODB_URL=.*#MONGODB_URL=mongodb://admin:\\${MONGO_ROOT_PASSWORD}@mongodb:27017/halo-prod?authSource=admin#' env/backend.env
              if ! grep -q '^JWT_SECRET=' env/backend.env; then
                echo "❌ JWT_SECRET missing in env/backend.env"
                exit 1
              fi
            fi

            if grep -q 'MONGODB_URL: .*replicaSet=rs0' "$COMPOSE_FILE"; then
              sed -i -E 's#(MONGODB_URL: mongodb://[^ ]+\\?authSource=admin)(&replicaSet=rs0)?#\\1#' "$COMPOSE_FILE"
            fi

            echo "🗄️ Ensuring required copilot DB migration is applied..."
            PG_CONTAINER="saby-postgres"
            if ! docker ps --format '{{.Names}}' | grep -q "^${PG_CONTAINER}\$"; then
              echo "⚠️ ${PG_CONTAINER} not found; skipping direct migration step"
            else
              docker exec -i "$PG_CONTAINER" psql -U halograph_user -d halograph -v ON_ERROR_STOP=1 -f - <<'SQL'
ALTER TABLE copilot.action_events
  ADD COLUMN IF NOT EXISTS result_json JSONB;
SQL
            fi

            echo "🚀 Recreating backend (no build)..."
            \$DC -f "\$COMPOSE_FILE" up -d --no-build --force-recreate backend

            echo "⏳ Waiting for backend to settle..."
            sleep 20

            echo "🏥 Backend service status..."
            \$DC -f "\$COMPOSE_FILE" ps backend

            echo "📊 Backend endpoint checks..."
            curl -fsS http://127.0.0.1:4000/api/health || true
            curl -kfsS https://api.saby.ai/api/health || true

            echo "📝 Recent backend logs:"
            docker logs saby-backend --tail 60 || docker logs saby-backend-production --tail 60 || true

            echo "✅ Backend deployment completed"
          ENDSSH
