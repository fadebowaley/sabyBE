name: 🚀 Unified VM Deployment (Staging + Production)

on:
  push:
    branches: [production, develop, proddy]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
          - proddy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fadebowaley/sabybe/halobe

permissions:
  contents: write
  packages: write

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # BUILD & PUSH IMAGE
  # ═══════════════════════════════════════════════════════════════════
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY TO STAGING - UNIFIED VM
  # ═══════════════════════════════════════════════════════════════════
  deploy-staging:
    name: 🧪 Deploy to Unified Staging VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment: staging
    steps:
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy to Unified Staging VM
        run: |
          echo "🚀 Deploying backend to UNIFIED Staging VM"
          echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop"
          echo "🖥️  VM: ${{ secrets.NEW_STAGING_IP }}"

          ssh -o StrictHostKeyChecking=no haloadmin@${{ secrets.NEW_STAGING_IP }} << 'ENDSSH'
            set -e
            cd /opt/saby
            
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u fadebowaley --password-stdin
            
            echo "📥 Pulling latest backend and WhatsApp images (no cache)..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml pull --no-parallel backend whatsapp
            
            echo "🛑 Stopping old backend and WhatsApp containers..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml stop backend whatsapp || true
            
            echo "🗑️ Removing old backend and WhatsApp containers..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml rm -f backend whatsapp || true
            
            echo "🚀 Starting new backend container (project: saby-staging)..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml up -d --force-recreate backend
            
            echo "⏳ Waiting for backend to be healthy..."
            sleep 20
            
            echo "🏥 Backend health check..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml ps backend
            
            echo "📊 Testing backend endpoint..."
            curl -f http://localhost:4000 || echo "⚠️ Backend not responding yet, may need more time"
            
            echo "📝 Recent backend logs:"
            docker logs saby-backend-staging --tail 20
            
            echo "🚀 Starting WhatsApp service (project: saby-staging)..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml up -d --force-recreate whatsapp
            
            echo "⏳ Waiting for WhatsApp to be healthy..."
            sleep 10
            
            echo "🏥 WhatsApp health check..."
            COMPOSE_PROJECT_NAME=saby-staging docker-compose -f docker-compose.staging.yml ps whatsapp
            
            echo "📝 Recent WhatsApp logs:"
            docker logs saby-staging-whatsapp --tail 20 || true
            
            echo "✅ Backend and WhatsApp deployment completed!"
          ENDSSH

      - name: ✅ Deployment Summary
        run: |
          echo "✅ Backend deployed to unified staging VM"
          echo "🌐 Backend accessible at: http://${{ secrets.NEW_STAGING_IP }}:4000"

  # ═══════════════════════════════════════════════════════════════════
  # DEPLOY TO PRODUCTION - UNIFIED VM
  # ═══════════════════════════════════════════════════════════════════
  deploy-production:
    name: 🏭 Deploy to Unified Production VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: |
      (github.ref == 'refs/heads/production' && github.event_name == 'push') ||
      (github.ref == 'refs/heads/proddy' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (inputs.environment == 'production' || inputs.environment == 'proddy'))
    environment: production
    steps:
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy to Unified Production VM
        run: |
          echo "🚀 Deploying backend to UNIFIED Production VM"
          echo "🌿 Branch: ${{ github.ref }}"
          echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production"

          ssh -o StrictHostKeyChecking=no haloadmin@${{ secrets.NEW_STAGING_IP }} << 'ENDSSH'
            set -e
            cd /opt/saby
            
            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u fadebowaley --password-stdin
            
            echo "📥 Pulling latest backend image (no cache)..."
            COMPOSE_PROJECT_NAME=saby-production docker-compose -f docker-compose.production.yml pull --no-parallel backend
            
            echo "🛑 Stopping old backend container..."
            COMPOSE_PROJECT_NAME=saby-production docker-compose -f docker-compose.production.yml stop backend || true
            
            echo "🗑️ Removing old backend container..."
            COMPOSE_PROJECT_NAME=saby-production docker-compose -f docker-compose.production.yml rm -f backend || true
            
            echo "🚀 Starting new backend container (project: saby-production)..."
            COMPOSE_PROJECT_NAME=saby-production docker-compose -f docker-compose.production.yml up -d --force-recreate backend
            
            echo "⏳ Waiting for backend to be healthy..."
            sleep 20
            
            echo "🏥 Backend health check..."
            COMPOSE_PROJECT_NAME=saby-production docker-compose -f docker-compose.production.yml ps backend
            
            echo "📊 Testing backend endpoint..."
            curl -f http://localhost:4000 || echo "⚠️ Backend not responding yet, may need more time"
            
            echo "📝 Recent backend logs:"
            docker logs saby-backend-production --tail 20
            
            echo "✅ Backend deployment completed!"
          ENDSSH
