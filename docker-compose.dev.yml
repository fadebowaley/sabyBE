services:
  # Development Backend Service with Hot Reload
  halobe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: halo-dev-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - DEBUG=*
      - PORT=4000
      - MONGODB_URL=mongodb://mongodb:27017/halo-dev
      # Local PostgreSQL configuration (via docker-compose service)
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-halograph_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local_test_password_2025}
      - POSTGRES_DB=halograph
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=dev-jwt-secret-key
      - HALOFE_URL=http://localhost:3000
      # Development storage configuration
      - STORAGE_PROVIDER=local
      # Email configuration (development)
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USERNAME=dev
      - SMTP_PASSWORD=dev
      - EMAIL_FROM=dev@halo.local
    volumes:
      # Hot reload for development
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - halo-dev-network

  # Development MongoDB
  mongodb:
    image: mongo:6.0
    container_name: halo-dev-mongodb
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: halo-dev
    volumes:
      - mongodb_dev_data:/data/db
    networks:
      - halo-dev-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: halo-dev-postgres
    environment:
      POSTGRES_DB: halograph
      POSTGRES_USER: halograph_user
      POSTGRES_PASSWORD: local_test_password_2025
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - halo-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halograph_user -d halograph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Development Redis
  redis:
    image: redis:7-alpine
    container_name: halo-dev-redis
    ports:
      - "6380:6379"
    networks:
      - halo-dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: halo-dev-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - halo-dev-network

volumes:
  mongodb_dev_data:
  postgres_dev_data:

networks:
  halo-dev-network:
    driver: bridge
