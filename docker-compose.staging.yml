services:
  # Staging Backend Service
  halobe:
    image: ghcr.io/fadebowaley/sabybe/halobe:develop
    container_name: halo-staging-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=staging
      - PORT=4000
      # MongoDB URL - Note: replicaSet=rs0 is required for NodeSync change streams
      # If staging MongoDB is not configured as a replica set, initialize it with:
      # mongosh --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
      - MONGODB_URL=mongodb://admin:staging-password@mongodb:27017/halo-staging?authSource=admin&replicaSet=rs0
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-halograph_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local_test_password_2025}
      - POSTGRES_DB=${POSTGRES_DB:-halograph}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-staging-redis-password}
      - JWT_SECRET=${JWT_SECRET:-staging-jwt-secret-change-this}
      - SABYFE_URL=${SABYFE_URL:-http://localhost:3000}
      # NodeSync configuration
      - NODE_SYNC_ENABLED=${NODE_SYNC_ENABLED:-true}
      - NODE_SYNC_BATCH_SIZE=${NODE_SYNC_BATCH_SIZE:-100}
      # Staging storage configuration
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-aws-s3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      # Email configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # Telegram configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      # WhatsApp configuration
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - halo-staging-network

  # Staging MongoDB
  mongodb:
    image: mongo:6.0
    container_name: halo-staging-mongodb
    environment:
      MONGO_INITDB_DATABASE: halo-staging
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-staging-password}
    volumes:
      - mongodb_staging_data:/data/db
    networks:
      - halo-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: halo-staging-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-halograph}
      POSTGRES_USER: ${POSTGRES_USER:-halograph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_test_password_2025}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - halo-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halograph_user} -d ${POSTGRES_DB:-halograph}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  # Staging Redis
  redis:
    image: redis:7-alpine
    container_name: halo-staging-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-staging-redis-password}
    networks:
      - halo-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-staging-redis-password}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Staging WhatsApp Service
  whatsapp:
    image: ghcr.io/fadebowaley/sabybe/halobe:develop
    container_name: saby-staging-whatsapp
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=staging
      - PORT=4001
      - WHATSAPP_PORT=4001
      # MongoDB URL - Note: replicaSet=rs0 is required for NodeSync change streams
      - MONGODB_URL=mongodb://admin:staging-password@mongodb:27017/halo-staging?authSource=admin&replicaSet=rs0
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-halograph_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local_test_password_2025}
      - POSTGRES_DB=${POSTGRES_DB:-halograph}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-staging-redis-password}
      - JWT_SECRET=${JWT_SECRET:-staging-jwt-secret-change-this}
      - SABYFE_URL=${SABYFE_URL:-http://localhost:3000}
      # Email/SMTP configuration (required for OTP delivery)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # WhatsApp configuration
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["node", "src/ingestion/whatsapp/server.js"]
    networks:
      - halo-staging-network

volumes:
  mongodb_staging_data:
  postgres_staging_data:

networks:
  halo-staging-network:
    driver: bridge
