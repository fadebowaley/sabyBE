
services:
  # Production Backend Service
  halobe:
    # build:
      # context: .
      # dockerfile: Dockerfile.prod
    container_name: halo-prod-backend
    image: halo-halobe:production
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URL=mongodb://mongodb:27017/halo-prod
      # Remote PostgreSQL configuration
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-halograph_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local_test_password_2025}
      - POSTGRES_DB=${POSTGRES_DB:-halograph}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword2025
      - JWT_SECRET=${JWT_SECRET:-production-jwt-secret-change-this}
      - HALOFE_URL=${HALOFE_URL:-http://localhost:3000}
      # Production storage configuration
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-aws-s3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      # Email configuration
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      # Telegram configuration
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      # WhatsApp configuration
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - halo-prod-network

  postgres:
    image: postgres:15-alpine
    container_name: halo-prod-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-halograph}
      POSTGRES_USER: ${POSTGRES_USER:-halograph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_test_password_2025}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - halo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-halograph_user} -d ${POSTGRES_DB:-halograph}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Production MongoDB
  mongodb:
    image: mongo:6.0
    container_name: halo-prod-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: halo-prod
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongodb_prod_data:/data/db
    networks:
      - halo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Production Redis
  redis:
    image: redis:7-alpine
    container_name: halo-prod-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword2025}
    volumes:
      - redis_prod_data:/data
    networks:
      - halo-prod-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redispassword2025}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_prod_data:
  redis_prod_data:
  postgres_prod_data:

networks:
  halo-prod-network:
    driver: bridge
